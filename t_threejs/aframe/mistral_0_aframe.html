<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Cube Rouge A-Frame</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
</head>

<body>
    <a-scene>
        <!-- Cube rouge de taille 0.1 en (0,0,0) -->
        <a-box position="0 0 0" rotation="0 0 0" scale="0.1 0.1 0.1" color="#FF0000"></a-box>

        <!-- Caméra par défaut -->
        <a-entity camera look-controls position="0 1.6 0"></a-entity>
        
        <!-- Fond gris clair -->
        <a-sky color="#ECECEC"></a-sky>
    </a-scene>
</body>

</html>
