<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Three.js Scene avec contrôles clavier</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script>
        // Variables de mouvement
        const moveSpeed = 0.1;
        const moveStates = {
            forward: false,
            backward: false,
            left: false,
            right: false
        };

        // Initialisation de la scène
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x333333);

        // Caméra positionnée à (0, 1.6, 0)
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 0);
        camera.lookAt(0, 1.6, -1); // Regarde devant elle

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lumière
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(1, 1, 1);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        // Cube rouge
        const cubeGeometry = new THREE.BoxGeometry(1, 1, 1);
        const cubeMaterial = new THREE.MeshPhongMaterial({ color: 0xff0000 });
        const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
        cube.position.set(0, 0, 0);
        cube.scale.set(0.1, 0.1, 0.1);
        scene.add(cube);

        // Sphère blanche
        const sphereGeometry = new THREE.SphereGeometry(0.5, 32, 32);
        const sphereMaterial = new THREE.MeshPhongMaterial({ color: 0xffffff });
        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        sphere.position.set(1, 1, 1);
        sphere.scale.set(0.1, 0.1, 0.1);
        scene.add(sphere);

        // Plan
        const planeGeometry = new THREE.PlaneGeometry(4, 4);
        const planeMaterial = new THREE.MeshPhongMaterial({
            color: 0x888888,
            side: THREE.DoubleSide
        });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = 0;
        scene.add(plane);

        // Gestion des événements clavier
        document.addEventListener('keydown', (event) => {
            switch (event.code) {
                case 'KeyW':
                case 'ArrowUp':
                    moveStates.forward = true;
                    break;
                case 'KeyA':
                case 'ArrowLeft':
                    moveStates.left = true;
                    break;
                case 'KeyS':
                case 'ArrowDown':
                    moveStates.backward = true;
                    break;
                case 'KeyD':
                case 'ArrowRight':
                    moveStates.right = true;
                    break;
            }
        });

        document.addEventListener('keyup', (event) => {
            switch (event.code) {
                case 'KeyW':
                case 'ArrowUp':
                    moveStates.forward = false;
                    break;
                case 'KeyA':
                case 'ArrowLeft':
                    moveStates.left = false;
                    break;
                case 'KeyS':
                case 'ArrowDown':
                    moveStates.backward = false;
                    break;
                case 'KeyD':
                case 'ArrowRight':
                    moveStates.right = false;
                    break;
            }
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Déplacement de la caméra
            if (moveStates.forward) {
                camera.translateZ(-moveSpeed);
            }
            if (moveStates.backward) {
                camera.translateZ(moveSpeed);
            }
            if (moveStates.left) {
                camera.translateX(-moveSpeed);
            }
            if (moveStates.right) {
                camera.translateX(moveSpeed);
            }

            renderer.render(scene, camera);
        }

        // Gestion du redimensionnement
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>

</html>
