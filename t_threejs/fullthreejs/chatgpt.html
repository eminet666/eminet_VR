<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <title>Three.js - fix import map</title>
    <style>
        body {
            margin: 0;
        }

        canvas {
            display: block;
        }
    </style>

    <!-- Import map : mappe le specifier "three" vers le module réel -->
    <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js"
    }
  }
  </script>
</head>

<body>
    <script type="module">
        import * as THREE from 'three';
        // PointerLock = acteur à l’intérieur vs Orbit = spectateur extérieur
        import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xeeeeee);

        const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 100);
        camera.position.set(3, 3, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        document.body.appendChild(renderer.domElement);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(3, 5, 2);
        scene.add(dirLight);
        scene.add(new THREE.AmbientLight(0x888888));

        // Cube rouge scale 0.1 en 0,0,0
        const cube = new THREE.Mesh(
            new THREE.BoxGeometry(1, 1, 1),
            new THREE.MeshStandardMaterial({ color: 0xff0000 })
        );
        cube.scale.set(0.1, 0.1, 0.1);
        cube.position.set(0, 0, 0);
        scene.add(cube);

        // Sphère blanche scale 0.1 en 1,1,1
        const sphere = new THREE.Mesh(
            new THREE.SphereGeometry(1, 32, 32),
            new THREE.MeshStandardMaterial({ color: 0xffffff })
        );
        sphere.scale.set(0.1, 0.1, 0.1);
        sphere.position.set(1, 1, 1);
        scene.add(sphere);

        // Plan 4x4 à y=0
        const plane = new THREE.Mesh(
            new THREE.PlaneGeometry(4, 4),
            new THREE.MeshStandardMaterial({ color: 0xaaaaaa, side: THREE.DoubleSide })
        );
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = 0;
        scene.add(plane);

        const controls = new OrbitControls(camera, renderer.domElement);

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });
    </script>
</body>

</html>
