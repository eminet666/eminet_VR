<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <title>A-Frame 1.7.0 - Fix Firefox Sound</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script>
        // Composant pour débloquer l'AudioContext Firefox au premier clic
        AFRAME.registerComponent('audio-unlock', {
            init: function () {
                const unlock = () => {
                    const sceneEl = this.el.sceneEl;
                    if (sceneEl.audioListener && sceneEl.audioListener.context.state === 'suspended') {
                        sceneEl.audioListener.context.resume();
                    }
                    window.removeEventListener('click', unlock);
                    window.removeEventListener('keydown', unlock);
                };
                window.addEventListener('click', unlock);
                window.addEventListener('keydown', unlock);
            }
        });

        // Composant pour jouer le son sur la touche 's'
        AFRAME.registerComponent('sound-on-key', {
            schema: {
                key: { type: 'string', default: 's' }
            },
            init: function () {
                this.onKeyDown = this.onKeyDown.bind(this);
                window.addEventListener('keydown', this.onKeyDown);
            },
            remove: function () {
                window.removeEventListener('keydown', this.onKeyDown);
            },
            onKeyDown: function (event) {
                if (event.key.toLowerCase() === this.data.key.toLowerCase()) {
                    const sound = this.el.components.sound;
                    if (sound) {
                        // Relance au cas où Firefox a remis en pause
                        if (this.el.sceneEl.audioListener.context.state === 'suspended') {
                            this.el.sceneEl.audioListener.context.resume().then(() => {
                                sound.playSound();
                            });
                        } else {
                            sound.playSound();
                        }
                    }
                }
            }
        });
    </script>
</head>

<body>
    <a-scene audio-unlock>
        <a-assets>
            <audio id="mon-audio" src="./assets/cigale.mp3" preload="auto" crossorigin="anonymous"></audio>
        </a-assets>

        <!-- positional: false simplifie la gestion audio sous Firefox (son 2D) -->
        <a-entity sound="src: #mon-audio; autoplay: false; positional: false" sound-on-key="key: s">
        </a-entity>

        <a-sky color="#ECECF4"></a-sky>
    </a-scene>
</body>

</html>
